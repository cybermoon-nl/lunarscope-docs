[package]
name = "master-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
